[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomdeeplit"
version = "0.1.1"
description = "Standalone, API-based literature intake for Zotero and DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
atomdeeplit = "atomdeeplit.__main__:main"

[tool.setuptools]
packages = ["atomdeeplit"]
